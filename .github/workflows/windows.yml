name: Windows build and checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Native script syntax and C# compilation
        run: node scripts/check-native-syntax.mjs
      - name: Unit and filesystem safety tests
        run: npm test
      - name: Disposable runner registry, profile, power, pointer, visual effects and startup exact restore
        shell: pwsh
        run: |
          & npx.cmd vitest run tests/tweaks.windows.test.ts tests/power.windows.test.ts tests/startup.windows.test.ts tests/pointer.windows.test.ts tests/visual-effects.windows.test.ts tests/cursor.windows.test.ts tests/power-tuning.windows.test.ts --no-file-parallelism --reporter=verbose 2>&1 | Tee-Object -FilePath native-windows.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $tail = (Get-Content native-windows.log -Tail 110) -join "`n"
            $annotation = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Native Windows validation::$annotation"
          }
          exit $testExit
        env:
          PANDORA_TEST_WINDOWS_TWEAKS: '1'
          PANDORA_TEST_WINDOWS_POWER: '1'
          PANDORA_TEST_WINDOWS_STARTUP: '1'
          PANDORA_TEST_WINDOWS_POINTER: '1'
          PANDORA_TEST_WINDOWS_VISUAL: '1'
          PANDORA_TEST_WINDOWS_CURSOR: '1'
          PANDORA_TEST_WINDOWS_POWER_TUNING: '1'
      - name: Install Chromium for UI tests
        run: npx playwright install chromium
      - name: UI smoke tests
        run: npm run test:ui -- --reporter=list,github
      - name: Build unsigned installer and portable executable
        shell: pwsh
        run: |
          & npm.cmd run dist:windows 2>&1 | Tee-Object -FilePath build-windows.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $tail = (Get-Content build-windows.log -Tail 90) -join "`n"
            $annotation = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows packaging::$annotation"
            '### Windows packaging failure' >> $env:GITHUB_STEP_SUMMARY
            '```text' >> $env:GITHUB_STEP_SUMMARY
            Get-Content build-windows.log -Tail 70 >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }
          exit $buildExit
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify package archives, architecture, bundled files and checksums
        run: npm run verify:package
      - name: Read-only packaged desktop smoke
        timeout-minutes: 3
        run: node scripts/smoke-desktop.mjs
        env:
          PANDORA_SMOKE_EXECUTABLE: release/win-unpacked/PANDORA.exe
      - name: Disposable Windows install, launch and uninstall
        timeout-minutes: 8
        shell: pwsh
        run: |
          try { ./scripts/test-installer.ps1 }
          catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Installer lifecycle::$message"
            throw
          }
      - name: Actual portable launcher smoke
        timeout-minutes: 4
        run: node scripts/smoke-portable.mjs
      - name: Record native validation and include testing instructions
        shell: pwsh
        run: |
          $manifest = Get-Content release/verification.json -Raw | ConvertFrom-Json
          $manifest.windowsLaunchVerified = $true
          $manifest | Add-Member -NotePropertyName installerLifecycleVerified -NotePropertyValue $true
          $manifest | Add-Member -NotePropertyName portableLauncherVerified -NotePropertyValue $true
          $manifest | Add-Member -NotePropertyName windowsValidation -NotePropertyValue @{
            runner = $env:RUNNER_OS
            runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            nativeCleanerFixtures = 'passed'
            disposableRegistryApplyRestore = 'passed'
            physicalHardwareTesting = 'still required'
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content release/verification.json -Encoding utf8
          node scripts/prepare-windows-handoff.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Download instructions could not be prepared.' }
      - uses: actions/upload-artifact@v5
        with:
          name: PANDORA-Windows-x64-unsigned
          path: |
            release/PANDORA-Setup-*.exe
            release/PANDORA-Setup-*.exe.sha256
            release/PANDORA-Portable-*.exe
            release/PANDORA-Portable-*.exe.sha256
            release/verification.json
            release/WINDOWS-QUICKSTART.md
            release/WINDOWS-HANDOFF.md
            release/windows-validation.md
            release/FORTNITE-SETTINGS.md
            release/FEATURES.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-failure-details
          path: |
            build-windows.log
            native-windows.log
            playwright-report
            test-results

# Unit tests exercise isolated adapters and temporary fixtures. The explicit
# opt-in registry check above changes and restores one HKCU value on the disposable
# hosted runner; it does not verify every preference's Windows shell behavior.
# The lifecycle job verifies disposable per-user installation and preservation.
# Physical hardware, GUI installation choices and upgrade paths remain manual gates.
